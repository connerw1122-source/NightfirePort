<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>NightfirePort roadmap as of 2026-10-16</title>
  <rect x="0.5" y="0.5" width="879" height="539" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="40" font-size="20" font-weight="600" fill="#1f2328">Roadmap</text>
  <text x="856" y="40" font-size="12" fill="#656d76" text-anchor="end">as of 2026-10-16</text>

  <!-- key -->
  <g font-size="12" fill="#656d76">
    <rect x="24" y="60" width="18" height="14" rx="3" fill="#2f6fcf"/>
    <text x="48" y="71">done / working now</text>
    <rect x="178" y="60" width="18" height="14" rx="3" fill="#dbe6f6" stroke="#2f6fcf" stroke-width="1.5"/>
    <text x="202" y="71">in progress</text>
    <rect x="288" y="60" width="18" height="14" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="312" y="71">planned</text>
  </g>

  <!-- ===== Single player ===== -->
  <text x="24" y="130" font-size="15" font-weight="600" fill="#1f2328">Single player</text>
  <g>
    <rect x="160" y="100" width="168" height="48" rx="6" fill="#2f6fcf"/>
    <text x="244" y="121" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Levels load</text>
    <text x="244" y="138" font-size="11" fill="#dbe6f6" text-anchor="middle">all 27 on-foot archives</text>

    <rect x="336" y="100" width="168" height="48" rx="6" fill="#2f6fcf"/>
    <text x="420" y="121" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Campaign playable</text>
    <text x="420" y="138" font-size="11" fill="#dbe6f6" text-anchor="middle">menus to results</text>

    <rect x="512" y="100" width="168" height="48" rx="6" fill="#dbe6f6" stroke="#2f6fcf" stroke-width="1.5"/>
    <text x="596" y="121" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Verify against PS2</text>
    <text x="596" y="138" font-size="11" fill="#656d76" text-anchor="middle">3 functions bit-exact so far</text>

    <rect x="688" y="100" width="168" height="48" rx="6" fill="#dbe6f6" stroke="#2f6fcf" stroke-width="1.5"/>
    <text x="772" y="121" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Remaining systems</text>
    <text x="772" y="138" font-size="11" fill="#656d76" text-anchor="middle">guard AI, animation, sound</text>
  </g>
  <text x="160" y="168" font-size="11.5" fill="#656d76">Sign-off rule: a subsystem counts as done only when every function in its port-map is ported or justified and the PCSX2 traces match.</text>

  <!-- ===== Multiplayer ===== -->
  <text x="24" y="232" font-size="15" font-weight="600" fill="#1f2328">Multiplayer</text>
  <g>
    <rect x="160" y="202" width="109" height="48" rx="6" fill="#2f6fcf"/>
    <text x="214.5" y="223" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Match core</text>
    <text x="214.5" y="240" font-size="11" fill="#dbe6f6" text-anchor="middle">done</text>

    <rect x="277" y="202" width="109" height="48" rx="6" fill="#2f6fcf"/>
    <text x="331.5" y="223" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Local game</text>
    <text x="331.5" y="240" font-size="11" fill="#dbe6f6" text-anchor="middle">quick game to arena</text>

    <rect x="394" y="202" width="109" height="48" rx="6" fill="#2f6fcf"/>
    <text x="448.5" y="223" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Online play</text>
    <text x="448.5" y="240" font-size="11" fill="#dbe6f6" text-anchor="middle">host / join, direct IP</text>

    <rect x="511" y="202" width="109" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="565.5" y="223" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Bots</text>
    <text x="565.5" y="240" font-size="11" fill="#656d76" text-anchor="middle">merged, not wired in</text>

    <rect x="628" y="202" width="109" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="682.5" y="223" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Split screen</text>
    <text x="682.5" y="240" font-size="11" fill="#656d76" text-anchor="middle">planned</text>

    <rect x="745" y="202" width="111" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="800.5" y="223" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Other modes</text>
    <text x="800.5" y="240" font-size="11" fill="#656d76" text-anchor="middle">radar, weapon sets</text>
  </g>
  <text x="160" y="270" font-size="11.5" fill="#656d76">The PS2 game had four-pad couch play only. Online play is the port's addition: UDP lockstep, no relay.</text>

  <!-- ===== Driving ===== -->
  <text x="24" y="334" font-size="15" font-weight="600" fill="#1f2328">Driving</text>
  <g>
    <rect x="160" y="304" width="226" height="48" rx="6" fill="#dbe6f6" stroke="#2f6fcf" stroke-width="1.5"/>
    <text x="273" y="325" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Formats and models</text>
    <text x="273" y="342" font-size="11" fill="#656d76" text-anchor="middle">tracks and cars read from the disc</text>

    <rect x="394" y="304" width="226" height="48" rx="6" fill="#dbe6f6" stroke="#2f6fcf" stroke-width="1.5"/>
    <text x="507" y="325" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Physics, roads, traffic</text>
    <text x="507" y="342" font-size="11" fill="#656d76" text-anchor="middle">merged as model code only</text>

    <rect x="628" y="304" width="228" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="742" y="325" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Playable missions</text>
    <text x="742" y="342" font-size="11" fill="#656d76" text-anchor="middle">5 campaign rows are skipped today</text>
  </g>
  <text x="160" y="372" font-size="11.5" fill="#656d76">A second, stripped engine on the disc. 3.1 % of its functions are cited so far; an 8-phase plan exists.</text>

  <!-- ===== PC features ===== -->
  <text x="24" y="436" font-size="15" font-weight="600" fill="#1f2328">PC features</text>
  <g>
    <rect x="160" y="406" width="168" height="48" rx="6" fill="#2f6fcf"/>
    <text x="244" y="427" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Mouse and keyboard</text>
    <text x="244" y="444" font-size="11" fill="#dbe6f6" text-anchor="middle">game, menus, mouse look</text>

    <rect x="336" y="406" width="168" height="48" rx="6" fill="#2f6fcf"/>
    <text x="420" y="427" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">High frame rate</text>
    <text x="420" y="444" font-size="11" fill="#dbe6f6" text-anchor="middle">120 fps tested, 60 Hz logic</text>

    <rect x="512" y="406" width="168" height="48" rx="6" fill="#2f6fcf"/>
    <text x="596" y="427" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Widescreen</text>
    <text x="596" y="444" font-size="11" fill="#dbe6f6" text-anchor="middle">any window size</text>

    <rect x="688" y="406" width="168" height="48" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="772" y="427" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="middle">Rebinding, rumble</text>
    <text x="772" y="444" font-size="11" fill="#656d76" text-anchor="middle">with accessibility, later</text>
  </g>
  <text x="160" y="474" font-size="11.5" fill="#656d76">Gamepad support is already in as an optional build feature, using the game's own mapping and curves.</text>

  <line x1="24" y1="496" x2="856" y2="496" stroke="#d0d7de"/>
  <text x="24" y="520" font-size="12" fill="#656d76">Biggest open items on foot: guard navigation and cover behaviour; room-by-room visibility (reverb zones stay off until it is done); sound reverb and resampling.</text>
</svg>
