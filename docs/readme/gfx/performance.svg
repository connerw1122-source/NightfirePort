<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616" viewBox="0 0 880 616" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>NightfirePort vs PCSX2 on the same PC, as of 2026-10-16</title>
  <rect x="0.5" y="0.5" width="879" height="615" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="40" font-size="20" font-weight="600" fill="#1f2328">Port vs PCSX2 on the same PC</text>
  <text x="856" y="40" font-size="12" fill="#656d76" text-anchor="end">as of 2026-10-16</text>
  <text x="24" y="62" font-size="12" fill="#656d76">AMD Ryzen 9 7900X, NVIDIA GeForce RTX 4090, Windows 10. Level 07000005 (Alps castle exterior), the level start view.</text>
  <text x="24" y="79" font-size="12" fill="#656d76">PCSX2: Vulkan, 4x internal resolution (2048x1792). Port: native 2560x1440.</text>

  <!-- key -->
  <g font-size="12" fill="#656d76">
    <rect x="24" y="96" width="18" height="12" rx="2" fill="#c8cdd3"/>
    <text x="48" y="106">PCSX2</text>
    <rect x="112" y="96" width="18" height="12" rx="2" fill="#2f6fcf"/>
    <text x="136" y="106">NightfirePort</text>
  </g>

  <!-- ===== left panel: fastest frame rate ===== -->
  <g transform="translate(24 128)">
    <rect x="0.5" y="0.5" width="404" height="150" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="28" font-size="14" font-weight="600" fill="#1f2328">Fastest frame rate, limiter off</text>
    <text x="16" y="46" font-size="11.5" fill="#656d76">frames per second, 10 s averages</text>

    <text x="16" y="79" font-size="12" fill="#656d76">PCSX2</text>
    <rect x="76" y="66" width="80" height="22" rx="3" fill="#c8cdd3"/>
    <text x="164" y="82" font-size="15" font-weight="600" fill="#1f2328">104 fps</text>

    <text x="16" y="121" font-size="12" fill="#656d76">Port</text>
    <rect x="76" y="108" width="300" height="22" rx="3" fill="#2f6fcf"/>
    <text x="368" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">389 fps</text>
  </g>

  <!-- ===== right panel: CPU to hold 60 fps ===== -->
  <g transform="translate(452 128)">
    <rect x="0.5" y="0.5" width="404" height="150" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="16" y="28" font-size="14" font-weight="600" fill="#1f2328">CPU needed to hold 60 fps</text>
    <text x="16" y="46" font-size="11.5" fill="#656d76">share of one core, process CPU time over 10 s</text>

    <text x="16" y="79" font-size="12" fill="#656d76">PCSX2</text>
    <rect x="76" y="66" width="279" height="22" rx="3" fill="#c8cdd3"/>
    <text x="347" y="82" font-size="15" font-weight="600" fill="#1f2328" text-anchor="end">93 %</text>

    <text x="16" y="121" font-size="12" fill="#656d76">Port</text>
    <rect x="76" y="108" width="75" height="22" rx="3" fill="#2f6fcf"/>
    <text x="159" y="124" font-size="15" font-weight="600" fill="#1f2328">25 %</text>
  </g>

  <!-- ===== strip: rocket barrage ===== -->
  <rect x="24.5" y="294.5" width="831" height="56" rx="8" fill="#dbe6f6" stroke="#2f6fcf"/>
  <text x="40" y="317" font-size="13" fill="#1f2328"><tspan font-weight="600">Under load:</tspan> 12 rockets at once at the castle gate, uncapped, while screen-recording at 60 fps.</text>
  <text x="40" y="337" font-size="13" fill="#1f2328">244–340 fps per-second averages, worst single frame 10.7 ms.</text>

  <!-- footnotes -->
  <g font-size="11.5" fill="#656d76">
    <text x="24" y="374">What the numbers mean: PCSX2's figure is emulation throughput. At its "Speed 173 %" readout the whole game, logic included, runs 1.73x fast.</text>
    <text x="24" y="391">The port keeps game logic at the original's fixed 60 Hz and renders as many frames as the hardware allows, interpolating between ticks, so 389 fps</text>
    <text x="24" y="408">is 389 rendered frames per second at normal game speed. PCSX2 draws a 4x upscale of the PS2's ~512x448 frame; the port renders natively at the window size.</text>
    <text x="24" y="425">Port at other sizes: 409 fps at 1920x1080 (28 % of a core for 60 fps), 386 fps at 1280x720. The original PS2 ran the game at 60 Hz with a 30 Hz fallback.</text>
  </g>

  <!-- ===== secondary panel: fixes along the way ===== -->
  <line x1="24" y1="444" x2="856" y2="444" stroke="#d0d7de"/>
  <text x="24" y="470" font-size="14" font-weight="600" fill="#1f2328">Fixes along the way</text>
  <text x="200" y="470" font-size="11.5" fill="#656d76">internal before / after measurements; each row on its own scale</text>

  <g font-size="12">
    <text x="24" y="502" fill="#1f2328">skin_palette per frame, 07000005</text>
    <rect x="300" y="492" width="420" height="10" rx="2" fill="#c8cdd3"/>
    <text x="728" y="502" fill="#656d76">35 ms</text>
    <rect x="300" y="506" width="16.8" height="10" rx="2" fill="#2f6fcf"/>
    <text x="324" y="516" fill="#1f2328" font-weight="600">1.4 ms</text>

    <text x="24" y="542" fill="#1f2328">colour_mults per frame, 07000005</text>
    <rect x="300" y="532" width="420" height="10" rx="2" fill="#c8cdd3"/>
    <text x="728" y="542" fill="#656d76">34.5 ms</text>
    <rect x="300" y="546" width="4.9" height="10" rx="2" fill="#2f6fcf"/>
    <text x="312" y="556" fill="#1f2328" font-weight="600">0.4 ms</text>

    <text x="24" y="582" fill="#1f2328">World draws, 07000007 start view (portal culling)</text>
    <rect x="300" y="572" width="420" height="10" rx="2" fill="#c8cdd3"/>
    <text x="728" y="582" fill="#656d76">4,526</text>
    <rect x="300" y="586" width="16.4" height="10" rx="2" fill="#2f6fcf"/>
    <text x="324" y="596" fill="#1f2328" font-weight="600">177</text>
  </g>
</svg>
