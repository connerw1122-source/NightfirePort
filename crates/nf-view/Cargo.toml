[package]
name = "nf-view"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Level viewer for 007: Nightfire (PS2) data read from the user's own disc image"

[dependencies]
nf-formats = { path = "../nf-formats" }
nf-game = { path = "../nf-game" }
nf-audio = { path = "../nf-audio" }
anyhow.workspace = true
bytemuck.workspace = true
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
glam = "0.34.1"
gilrs = { version = "0.11.2", optional = true }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[features]
# The gamepad backend (fix-input): `gilrs` (MIT OR Apache-2.0) reads the OS pad; the port then
# runs the game's own mapping and curves on it (docs/systems/input.md). Off by default — master
# builds and tests without it (and without gilrs in the dep tree). Needs libudev to build
# (gilrs-core's Linux hotplug).
gamepad = ["dep:gilrs"]
